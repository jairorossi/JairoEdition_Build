name: Build Custom ROM JairoEdition A14

on:
  workflow_dispatch: # Permite iniciar a compilacao manualmente com um clique no site do GitHub

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # EXPANDE A PARTICAO RAIZ PARA OCUPAR 100% DO DISCO FISICO SSD DA VM (~95GB livres!)
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install Repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Configure Git identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Initialize ROM sources (LineageOS 21.0)
        run: |
          mkdir -p ~/android
          cd ~/android
          repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1

      - name: Copy local manifests
        run: |
          mkdir -p ~/android/.repo/local_manifests
          cp local_manifests/raphael.xml ~/android/.repo/local_manifests/

      - name: Sync ROM sources
        run: |
          cd ~/android
          # Sincroniza apenas o necessário e de forma otimizada
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          
          echo "=== Disk usage BEFORE deleting .repo ==="
          df -h
          
          # DELETA A PASTA .REPO PARA LIBERAR ~45GB DE ESPACO EM DISCO!
          echo "=== Deleting .repo directory to free up space ==="
          rm -rf .repo
          
          echo "=== Disk usage AFTER deleting .repo ==="
          df -h

      - name: Apply JairoEdition Customizations & Build
        run: |
          cd ~/android
          # Injeta flags de creditos no device.mk da arvore do Raphael antes de iniciar
          device_mk="device/xiaomi/raphael/device.mk"
          if [ -f "$device_mk" ]; then
            echo "" >> $device_mk
            echo "# JairoEdition Custom Properties" >> $device_mk
            echo "PRODUCT_PROPERTY_OVERRIDES += ro.lineage.maintainer=\"Jairo Rossi\"" >> $device_mk
            echo "WITH_GAPPS := true" >> $device_mk
          fi
          
          # Inicia o processo de build do compilador Android
          . build/envsetup.sh
          lunch lineage_raphael-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload compiled ROM to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JairoEdition-ROM
          path: /home/runner/android/out/target/product/raphael/lineage-21.0-*.zip
          retention-days: 7
