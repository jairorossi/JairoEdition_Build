name: Build Custom ROM JairoEdition A14

on:
  workflow_dispatch: # Permite iniciar a compilacao manualmente com um clique no site do GitHub

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PASSO 1: Limpeza fisica e configuracao de 4GB de swap nativo (ideal com o Git otimizado)
      - name: Cleanup Host Disk & Setup 4GB Swap
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h
          
          echo "Deletando softwares redundantes para liberar espaco..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chrome-driver
          sudo rm -rf /usr/local/share/powershell
          
          echo "=== Disk space AFTER cleanup ==="
          df -h
          
          echo "=== Configurando 4GB de Swap (RAM Virtual) ==="
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          echo "=== Status da memoria e swap atualizado ==="
          free -h

      # PASSO 2: Instala as dependencias na particao raiz nativa
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install Repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Configure Git & RAM Optimizations
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          # Otimizações de concorrência e memória do Git
          git config --global pack.threads 1
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 256m
          git config --global core.preloadIndex true
          git config --global core.symlinks true

      # PASSO 3: Inicia a preparacao e download do Android na pasta padrão do usuário (~/android)
      - name: Initialize ROM sources (LineageOS 21.0)
        run: |
          mkdir -p ~/android
          cd ~/android
          repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1 --groups=all,-notdefault,-darwin,-windows

      - name: Copy local manifests
        run: |
          mkdir -p ~/android/.repo/local_manifests
          cp local_manifests/raphael.xml ~/android/.repo/local_manifests/

      - name: Sync ROM sources
        run: |
          cd ~/android
          # Sincroniza apenas o necessário e de forma otimizada
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          
          echo "=== Disk usage BEFORE deleting .repo ==="
          df -h
          
          # DELETA A PASTA .REPO PARA LIBERAR ~45GB DE ESPACO EM DISCO!
          echo "=== Deleting .repo directory to free up space ==="
          rm -rf .repo
          
          echo "=== Disk usage AFTER deleting .repo ==="
          df -h

      - name: Apply JairoEdition Customizations & Build
        run: |
          cd ~/android
          # Injeta flags de creditos no device.mk da arvore do Raphael antes de iniciar
          device_mk="device/xiaomi/raphael/device.mk"
          if [ -f "$device_mk" ]; then
            echo "" >> $device_mk
            echo "# JairoEdition Custom Properties" >> $device_mk
            echo "PRODUCT_PROPERTY_OVERRIDES += ro.lineage.maintainer=\"Jairo Rossi\"" >> $device_mk
            echo "WITH_GAPPS := true" >> $device_mk
          fi
          
          # Inicia o processo de build do compilador Android
          . build/envsetup.sh
          lunch lineage_raphael-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload compiled ROM to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JairoEdition-ROM
          path: /home/runner/android/out/target/product/raphael/lineage-21.0-*.zip
          retention-days: 7
